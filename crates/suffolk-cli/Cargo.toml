[package]
name = "suffolk-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "suffolk"
path = "src/main.rs"

[dependencies]
suffolk-ir = { path = "../suffolk-ir" }
suffolk-codec = { path = "../suffolk-codec" }
suffolk-formats = { path = "../suffolk-formats" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
