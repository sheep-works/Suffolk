[package]
name = "suffolk-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
suffolk-ir = { path = "../suffolk-ir" }
suffolk-codec = { path = "../suffolk-codec" }
suffolk-formats = { path = "../suffolk-formats" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
thiserror = "2.0"
regex = "1.11"
